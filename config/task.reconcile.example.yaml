task:
  id: task-007
  input: ../data/task-007/task-006-input.jsonl
  output: ../data/task-007/task-007-final.jsonl
  state: ../data/task-007/task-007-state.db

model:
  base_url: https://aigateway.venusgroup.com.cn/ai/deepseek/openai
  api_key_env: AI_GATEWAY_API_KEY
  name: deepseek-v4-pro
  structured_output: json_object
  temperature: 0
  top_p: 1
  max_tokens: 5000
  seed: 42
  timeout: 60s
  extra_body:
    frequency_penalty: 0

prompt:
  system_file: ../prompts/reconcile-system.txt
  scene: auto
  risk_types_file: risk-types.yaml

runtime:
  concurrency: 40
  requests_per_minute: 600
  tokens_per_minute: 0
  shutdown_timeout: 30s
  cover_concurrency: 4
  cover_requests_per_minute: 10

retry:
  request_max_attempts: 10
  format_repair_attempts: 2
  initial_backoff: 1s
  max_backoff: 20s

output:
  schema_file: result-schema-v2.json
  explanation_min_length: 10
  explanation_max_length: 70
