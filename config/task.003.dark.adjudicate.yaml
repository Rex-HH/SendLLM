task:
  id: task-003-dark-adjudicate
  input: ../data/task-003-dark-adjudicate/sendllm_differences.jsonl
  output: ../data/task-003-dark-adjudicate/final_8_4.jsonl
  state: ../data/task-003-dark-adjudicate/task-003-dark-adjudicate.db

model:
  base_url: https://aigateway.venusgroup.com.cn/ai/aliyun/openai
  api_key_env: AI_GATEWAY_API_KEY
  name: qwen3.7-plus
  structured_output: json_object
  temperature: 0
  top_p: 1
  max_tokens: 2000
  seed: 42
  timeout: 60s
  extra_body:
    frequency_penalty: 0

prompt:
  system_file: ../prompts/adjudicate-system.txt
  scene: auto
  risk_types_file: risk-types.yaml

runtime:
  concurrency: 100
  requests_per_minute: 10000
  tokens_per_minute: 0
  shutdown_timeout: 30s

retry:
  request_max_attempts: 15
  format_repair_attempts: 2
  initial_backoff: 1s
  max_backoff: 20s

output:
  schema_file: result-schema.json
  explanation_min_length: 10
  explanation_max_length: 70
