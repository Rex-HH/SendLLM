task:
  id: task-009-011-failed-retry
  input: ../data/failed-retry/task-009-011-failed.jsonl
  output: ../data/failed-retry/task-009-011-failed-retry-final.jsonl
  state: ../data/failed-retry/task-009-011-failed-retry-state.db

model:
  base_url: https://aigateway.venusgroup.com.cn/ai/deepseek/openai
  api_key_envs:
    - AI_GATEWAY_API_KEY
    - J_C_AI_GATEWAY_API_KEY
    - Y_N_AI_GATEWAY_API_KEY
  name: deepseek-v4-pro
  structured_output: json_object
  temperature: 0
  top_p: 1
  max_tokens: 3000
  seed: 42
  timeout: 180s
  extra_body:
    frequency_penalty: 0

prompt:
  system_file: ../prompts/reconcile-system-prompt-batch.txt
  scene: auto
  risk_types_file: risk-types.yaml

runtime:
  concurrency: 9
  requests_per_minute: 90
  tokens_per_minute: 0
  shutdown_timeout: 30s
  cover_concurrency: 6
  cover_requests_per_minute: 60
  batch_size: 1
  batch_max_input_tokens: 60000

retry:
  request_max_attempts: 10
  format_repair_attempts: 2
  initial_backoff: 5s
  max_backoff: 120s

output:
  schema_file: result-schema-v2.json
  explanation_min_length: 10
  explanation_max_length: 70
