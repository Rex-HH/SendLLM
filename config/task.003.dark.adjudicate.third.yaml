task:
  id: task-003-dark-adjudicate-third
  input: ../data/task-003-dark-adjudicate-remaining/sendllm_differences.remaining_for_third_model.jsonl
  output: ../data/task-003-dark-adjudicate-remaining/final_8_4.third_model.jsonl
  state: ../data/task-003-dark-adjudicate-remaining/task-003-dark-adjudicate-third.db

model:
  base_url: https://aigateway.venusgroup.com.cn/ai/aliyun/openai
  api_key_env: AI_GATEWAY_API_KEY
  name: deepseek-v4-flash
  structured_output: json_object
  temperature: 0
  top_p: 1
  max_tokens: 2000
  seed: 42
  timeout: 60s
  extra_body:
    frequency_penalty: 0

prompt:
  system_file: ../prompts/adjudicate-system.txt
  scene: auto
  risk_types_file: risk-types.yaml

runtime:
  concurrency: 200
  requests_per_minute: 20000
  tokens_per_minute: 0
  shutdown_timeout: 15s

retry:
  request_max_attempts: 10
  format_repair_attempts: 0
  initial_backoff: 1s
  max_backoff: 20s

output:
  schema_file: result-schema.json
  explanation_min_length: 10
  explanation_max_length: 70
