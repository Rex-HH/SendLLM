task:
  id: task-014
  input: ../data/task-014/task-013.sample-10000.jsonl
  output: ../data/task-014/task-014-final.jsonl
  state: ../data/task-014/task-014-state.db

model:
  base_url: https://aigateway.venusgroup.com.cn/ai/zhipu/openai?
  api_key_envs:
    - AI_GATEWAY_API_KEY
    - J_C_AI_GATEWAY_API_KEY
  name: GLM-5.3
  structured_output: json_object
  temperature: 0
  top_p: 1
  max_tokens: 8000
  seed: 42
  timeout: 120s
  extra_body:
    frequency_penalty: 0

prompt:
  system_file: ../prompts/reconcile-system-unified-batch.txt
  scene: auto
  risk_types_file: risk-types.yaml

runtime:
  concurrency: 30
  requests_per_minute: 600
  tokens_per_minute: 0
  shutdown_timeout: 30s
  cover_concurrency: 12
  cover_requests_per_minute: 180
  batch_size: 3
  batch_max_input_tokens: 30000

retry:
  request_max_attempts: 10
  format_repair_attempts: 2
  initial_backoff: 3s
  max_backoff: 60s

output:
  schema_file: result-schema-v2.json
  explanation_min_length: 10
  explanation_max_length: 70
