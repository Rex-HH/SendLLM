task:
  id: task-003-dev
  input: ../data/task-003/compact.jsonl
  output: ../data/task-003/output.jsonl
  state: ../data/task-003/task-003.db

model:
  base_url: https://aigateway.venusgroup.com.cn/ai/deepseek/openai
  api_key_env: AI_GATEWAY_API_KEY
  name: deepseek-v4-pro
  structured_output: json_object
  temperature: 0
  top_p: 1
  max_tokens: 2000
  seed: 42
  timeout: 60s
  extra_body:
    frequency_penalty: 0

prompt:
  system_file: ../prompts/my-batch-system.txt
  scene: auto
  risk_types_file: risk-types.yaml

runtime:
  concurrency: 4
  requests_per_minute: 0
  tokens_per_minute: 0
  shutdown_timeout: 30s

retry:
  request_max_attempts: 5
  format_repair_attempts: 2
  initial_backoff: 1s
  max_backoff: 60s

output:
  schema_file: result-schema.json
  explanation_min_length: 10
  explanation_max_length: 70
