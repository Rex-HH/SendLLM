id: jailbreak
axis: attack_method
version: 1
title: 越狱攻击
enabled_scenes: [prompt]
primary_priority: 101
definition: "操作性地要求模型忽略、关闭或规避安全限制。"
target_attributes: []
required_conditions:
  - {id: M-OPERATIONAL-ACTION, text: "存在可操作的对抗动作。"}
